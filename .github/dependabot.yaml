version: 2

# cooldown: сколько дней новая версия «отлёживается», прежде чем Dependabot
# предложит на неё обновиться. Это защита от supply-chain: если релиз пакета
# скомпрометирован, окно обычно закрывают в первые дни, и мы в него не въезжаем.
#
# Важно: cooldown действует ТОЛЬКО на version updates. Security updates его
# игнорируют и приезжают сразу, так что фиксы вроде go-git 5.19.2 не
# задерживаются ни на день.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
updates:
  # Go модули
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7

  # Dependabot security updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "security(deps)"
    cooldown:
      default-days: 7
