name: Bearer

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rule_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Нужно для заливки SARIF в Security-таб (только на push, см. ниже).
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          format: sarif
          output: bearer.sarif

      # Заливаем результат даже если предыдущий шаг упал на находках: сам job
      # всё равно останется красным, но находки будут видны в Security-табе,
      # а не только в логах.
      #
      # Только на push: у PR от Dependabot токен read-only, security-events там
      # не выдаётся и загрузка гарантированно падала бы.
      - name: Upload SARIF to Security tab
        if: ${{ always() && github.event_name == 'push' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: bearer.sarif
          category: bearer
