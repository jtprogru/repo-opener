name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Новые CVE появляются и без изменений в коде, поэтому сканируем еженедельно.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
