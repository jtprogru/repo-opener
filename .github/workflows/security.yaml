name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Новые CVE появляются и без изменений в коде, поэтому сканируем еженедельно.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Нужно для заливки SARIF в Security-таб (только на push, см. ниже).
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Аудит самих workflow-файлов: инъекции через недоверенный ввод,
      # незапиненные actions, отравление кэша, лишние permissions.
      # Trivy это не покрывает — в его misconfig-сканерах GitHub Actions нет.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Только на push: у PR от Dependabot токен read-only, security-events
          # там не выдаётся и загрузка SARIF гарантированно падала бы.
          advanced-security: ${{ github.event_name == 'push' }}
