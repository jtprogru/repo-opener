name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Новые CVE появляются и без изменений в коде, поэтому сканируем еженедельно.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: .go-version
          cache: true
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Без явной версии action подставит "stable" и сам поставит другой Go.
          go-version-input: ${{ steps.go.outputs.go-version }}
          go-package: ./...

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Нужно для заливки SARIF в Security-таб (только на push, см. ниже).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Аудит самих workflow-файлов: инъекции через недоверенный ввод,
      # незапиненные actions, отравление кэша, лишние permissions.
      # Trivy это не покрывает — в его misconfig-сканерах GitHub Actions нет.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Только на push: у PR от Dependabot токен read-only, security-events
          # там не выдаётся и загрузка SARIF гарантированно падала бы.
          advanced-security: ${{ github.event_name == 'push' }}
