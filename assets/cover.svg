<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="repo-opener — print and open your Git remote URL">
  <title>repo-opener</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#10161f"/>
      <stop offset="100%" stop-color="#0b1a12"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BB359"/>
      <stop offset="100%" stop-color="#3fa7c9"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5BB359" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5BB359" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim  { fill: #8b949e; }
      .fg   { fill: #e6edf3; }
      .grn  { fill: #5BB359; }
      .cyn  { fill: #58c6d8; }
      .yel  { fill: #d8a657; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="1060" cy="120" rx="460" ry="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- brand block -->
  <g transform="translate(72, 96)">
    <rect x="0" y="0" width="118" height="28" rx="14" fill="#5BB359" fill-opacity="0.14" stroke="#5BB359" stroke-opacity="0.45"/>
    <text class="mono grn" x="16" y="19" font-size="13" letter-spacing="1.6">GO · CLI</text>

    <text class="mono fg" x="0" y="112" font-size="76" font-weight="700" letter-spacing="-1.5">repo-opener</text>

    <text class="sans dim" x="2" y="158" font-size="24">Prints the current repo&#8217;s remote URL. Opens it in the browser.</text>
    <text class="sans dim" x="2" y="192" font-size="24">Branch-aware, and it knows your self-hosted forge too.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(72, 330)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="232" rx="14" fill="#0a0e14" stroke="#2a313c"/>
    <rect x="0" y="0" width="1136" height="40" rx="14" fill="#161b22"/>
    <rect x="0" y="26" width="1136" height="14" fill="#161b22"/>
    <line x1="0" y1="40" x2="1136" y2="40" stroke="#2a313c"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="20" r="6" fill="#febc2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <text class="mono dim" x="568" y="25" font-size="13" text-anchor="middle">~/work/repo-opener — zsh</text>

    <text class="mono" x="28" y="82" font-size="19">
      <tspan class="grn">➜</tspan><tspan class="cyn" dx="12">repo-opener</tspan><tspan class="yel" dx="12">git:(</tspan><tspan class="grn">main</tspan><tspan class="yel">)</tspan><tspan class="fg" dx="14">repo-opener</tspan>
    </text>
    <text class="mono fg" x="28" y="114" font-size="19" fill-opacity="0.92">https://github.com/jtprogru/repo-opener</text>

    <text class="mono" x="28" y="160" font-size="19">
      <tspan class="grn">➜</tspan><tspan class="cyn" dx="12">repo-opener</tspan><tspan class="yel" dx="12">git:(</tspan><tspan class="grn">feat/branch-urls</tspan><tspan class="yel">)</tspan><tspan class="fg" dx="14">repo-opener -o</tspan>
    </text>
    <text class="mono fg" x="28" y="192" font-size="19" fill-opacity="0.92">https://github.com/jtprogru/repo-opener/tree/feat/branch-urls</text>
    <text class="mono dim" x="28" y="216" font-size="15">… and it just opened in your browser</text>
  </g>

  <!-- host chips -->
  <g transform="translate(72, 604)" class="mono" font-size="14">
    <g>
      <rect x="0" y="-18" width="88" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="44" y="0" text-anchor="middle">GitHub</text>
    </g>
    <g transform="translate(100, 0)">
      <rect x="0" y="-18" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="40" y="0" text-anchor="middle">GitLab</text>
    </g>
    <g transform="translate(192, 0)">
      <rect x="0" y="-18" width="98" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="49" y="0" text-anchor="middle">Bitbucket</text>
    </g>
    <g transform="translate(302, 0)">
      <rect x="0" y="-18" width="74" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="37" y="0" text-anchor="middle">Gitea</text>
    </g>
    <g transform="translate(388, 0)">
      <rect x="0" y="-18" width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="42" y="0" text-anchor="middle">Forgejo</text>
    </g>
    <g transform="translate(484, 0)">
      <rect x="0" y="-18" width="158" height="26" rx="13" fill="#5BB359" fill-opacity="0.10" stroke="#5BB359" stroke-opacity="0.35"/>
      <text class="grn" x="79" y="0" text-anchor="middle">self-hosted too</text>
    </g>
  </g>

  <text class="mono dim" x="1208" y="604" font-size="14" text-anchor="end">github.com/jtprogru/repo-opener</text>
</svg>
