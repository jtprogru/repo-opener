# Trivy configuration for local `trivy fs` scans.
# Docs: https://trivy.dev/latest/docs/references/configuration/config-file/
---
scan:
  scanners:
    - vuln       # known CVEs in go.mod / go.sum
    - secret     # hard-coded credentials, tokens, keys
    # misconfig оставлен как ловушка на будущее: в репозитории сейчас нет ни
    # Dockerfile, ни Terraform, ни Helm/K8s-манифестов, поэтому сканер честно
    # пишет "Detected config files num=0". Он сработает, если такие файлы
    # появятся. GitHub Actions сюда НЕ входит — среди misconfig-сканеров Trivy
    # его просто нет, workflow-файлы аудирует zizmor (см. make lint-zizmor).
    - misconfig
  # Пути, которые точно не относятся к исходному коду и только шумят в отчёте.
  skip-dirs:
    - .git         # история и служебные файлы git
    - dist         # артефакты сборки GoReleaser (бинарники)
    - .gocache     # локальный кэш сборки Go
    - .serena      # кэш и память инструмента Serena, не часть кодовой базы
  # Отдельные файлы-артефакты, которые не нужно сканировать.
  skip-files:
    - cover.out    # отчёт покрытия тестами

severity:
  - MEDIUM
  - HIGH
  - CRITICAL

# Не валить сканирование, если БД уязвимостей ещё не скачана в оффлайне.
exit-code: 1
